      <path d="M206 255L94 235L147 168L240 184Z" fill="#6F8E9B"/>
      <path d="M147 168L191 145L240 184Z" fill="#F0D5A1"/>
      <path d="M191 145L283 150L240 184Z" fill="#D98568"/>
      <path d="M283 150L326 170L302 179L240 184Z" fill="#B75D4A"/>

      <path d="M106 82L147 168M212 40L191 145M330 69L283 150M423 157L326 170M343 238L302 179M206 255L240 184M94 235L147 168" stroke="#5B5A54" stroke-opacity=".24" stroke-width="1.4"/>
      <path d="M147 168L191 145L283 150L326 170L302 179L240 184Z" stroke="#5B5A54" stroke-opacity=".3" stroke-width="1.2"/>
    </g>

    <g transform="translate(1025 77) rotate(9)" filter="url(#layerShadow)">
      <path d="M0 0L98 24L71 91L-17 62Z" fill="#F2C882"/>
      <path d="M0 0L45 49L-17 62Z" fill="#D47B5C"/>
      <path d="M98 24L45 49L71 91Z" fill="#8FAEA4"/>
      <path d="M0 0L45 49L98 24M45 49L71 91M45 49L-17 62" stroke="#5B5A54" stroke-opacity=".28" stroke-width="1.2"/>
    </g>

    <g transform="translate(692 302)">
      <path d="M0 0H418" stroke="#2F302E" stroke-opacity=".3" stroke-width="1.2"/>
      <text x="0" y="20" fill="#2F302E" font-family="Arial, sans-serif" font-size="9" font-weight="800" letter-spacing="2.2">WEIGHT → FOLD → RELATION / 014</text>
